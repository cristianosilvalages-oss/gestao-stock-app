<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Stock</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0}.hidden{display:none!important}
    .top{background:#fff;border-bottom:1px solid #e5e9f2;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
    .brand{font-size:20px;font-weight:800}.user{font-size:13px;color:#667085}
    main{max-width:1200px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
    .card,.panel{background:#fff;border:1px solid #e5e9f2;border-radius:14px;padding:18px;box-shadow:0 2px 8px #18223008}
    .card strong{display:block;font-size:28px;margin-top:4px}.muted{color:#667085;font-size:13px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}
    input,button,select{font:inherit;border-radius:9px;border:1px solid #d7dce5;padding:10px 12px;background:#fff}
    button{cursor:pointer;font-weight:650}.primary{background:#172033;color:#fff;border-color:#172033}.danger{color:#b42318}
    table{width:100%;border-collapse:collapse} th,td{padding:11px 9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}
    th{font-size:12px;text-transform:uppercase;color:#667085}.low{color:#b42318;font-weight:750}.ok{color:#067647;font-weight:700}
    .actions{display:flex;gap:6px}.actions button{padding:6px 10px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab.active{background:#172033;color:#fff}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .panel{width:min(420px,100%)}h1,h2{margin-top:0}
    .field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field input{width:100%}
    .msg{margin-top:10px;font-size:13px}.error{color:#b42318}.success{color:#067647}
    .modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px;z-index:20}.modal .panel{width:min(430px,100%)}
    @media(max-width:760px){main{padding:12px}.cards{grid-template-columns:1fr}.panel{overflow-x:auto}table{min-width:700px}.top{padding:12px}.user{display:none}}
  </style>

<style>
.product-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btn-small{padding:6px 9px;border-radius:8px;border:1px solid #d7dce5;background:#fff;cursor:pointer;font-size:12px}
.btn-small:hover{background:#f4f6f8}
.btn-danger{color:#b42318;border-color:#f0b8b4}
.btn-success{color:#067647;border-color:#a7d7bf}
</style>
</head>
<body>

<section id="loginView" class="login">
  <div class="panel">
    <h1>Gestão de Stock</h1>
    <p class="muted">Entre para gerir o stock.</p>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Palavra-passe</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="primary" style="width:100%">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</section>

<section id="appView" class="hidden">
  <header class="top">
    <div class="brand">Gestão de Stock</div>
    <div><span id="userEmail" class="user"></span> <button id="logoutBtn">Sair</button></div>
  </header>
  <main>
    <div class="cards">
      <div class="card"><span class="muted">Produtos ativos</span><strong id="totalProducts">0</strong></div>
      <div class="card"><span class="muted">Stock total</span><strong id="totalStock">0</strong></div>
      <div class="card"><span class="muted">Alertas</span><strong id="lowStock">0</strong></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="stock">Stock</button>
      <button class="tab" data-tab="history">Histórico</button>
    </div>

    <section id="stockTab" class="panel">
      <div class="toolbar">
        <input id="search" placeholder="Pesquisar por número ou nome...">
        <button id="newProductBtn" class="primary">+ Novo produto</button>
      </div>
      <table>
        <thead><tr><th>N.º</th><th>Nome</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th>Ações</th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table>
    </section>

    <section id="historyTab" class="panel hidden">
      <div class="toolbar"><button id="refreshHistory">Atualizar histórico</button></div>
      <table>
        <thead><tr><th>Data</th><th>Produto</th><th>Movimento</th><th>Qtd.</th><th>Antes</th><th>Depois</th><th>Utilizador</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </section>
  </main>
</section>

<div id="modal" class="modal hidden">
  <div class="panel">
    <h2 id="modalTitle">Movimento</h2>
    <div class="field"><label>Quantidade</label><input id="movementQty" type="number" min="1" step="1"></div>
    <div class="field"><label>Observação (opcional)</label><input id="movementNote" maxlength="200"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="cancelModal">Cancelar</button>
      <button id="confirmModal" class="primary">Confirmar</button>
    </div>
    <div id="modalMsg" class="msg"></div>
  </div>
</div>

<div id="productModal" class="modal hidden">
  <div class="panel">
    <h2>Novo produto</h2>
    <div class="field"><label>Número (0–220)</label><input id="productNumber" type="number" min="0" max="220"></div>
    <div class="field"><label>Nome</label><input id="productName"></div>
    <div class="field"><label>Stock inicial</label><input id="productStock" type="number" min="0" value="0"></div>
    <div class="field"><label>Stock mínimo</label><input id="productMin" type="number" min="0" value="0"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button id="cancelProduct">Cancelar</button><button id="saveProduct" class="primary">Criar</button></div>
    <div id="productMsg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lbqrpfriitsxoctkvzms.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wnjPHxBWGXLKpcsX9bJOcg_Y-9lyavw";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null, movementProduct = null, movementType = null, products = [];

const $ = id => document.getElementById(id);
function msg(id, text, ok=false){ $(id).textContent=text; $(id).className="msg "+(ok?"success":"error"); }

async function init(){
  if(SUPABASE_URL.includes("COLE_AQUI")) { msg("loginMsg","Configure primeiro a URL e a anon key do Supabase."); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(session) showApp(session.user); else showLogin();
  sb.auth.onAuthStateChange((_e,session)=> session ? showApp(session.user) : showLogin());
}
function showLogin(){ $("loginView").classList.remove("hidden"); $("appView").classList.add("hidden"); }
async function showApp(user){
  currentUser=user; $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
  $("userEmail").textContent=user.email || "";
  await loadProducts();
}
$("loginBtn").onclick=async()=>{
  msg("loginMsg","");
  const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error) msg("loginMsg",error.message);
};
$("logoutBtn").onclick=()=>sb.auth.signOut();

async function loadProducts(){
  const {data,error}=await sb.from("products").select("*").eq("ativo",true).order("numero");
  if(error){ alert(error.message); return; }
  products=data||[]; renderProducts();
}
function renderProducts(){
  const q=$("search").value.trim().toLowerCase();
  const rows=products.filter(p=>String(p.numero).includes(q)||(p.nome||"").toLowerCase().includes(q));
  $("stockBody").innerHTML=rows.map(p=>{
    const low=p.stock<=p.stock_minimo;
    return `<tr>
      <td>${p.numero}</td><td>${escapeHtml(p.nome||"—")}</td><td><b>${p.stock}</b></td><td>${p.stock_minimo}</td>
      <td class="${low?'low':'ok'}">${low?'⚠ Repor':'✓ OK'}</td>
      <td class="actions"><button onclick="openMovement(${p.id},'entrada')">+ Entrada</button><button onclick="openMovement(${p.id},'saida')">− Saída</button></td>
    </tr>`;
  }).join("");
  $("totalProducts").textContent=products.length;
  $("totalStock").textContent=products.reduce((s,p)=>s+p.stock,0);
  $("lowStock").textContent=products.filter(p=>p.stock<=p.stock_minimo).length;
}
$("search").oninput=renderProducts;

window.openMovement=(id,type)=>{
  movementProduct=products.find(p=>p.id===id); movementType=type;
  $("modalTitle").textContent=(type==="entrada"?"Entrada":"Saída")+" — produto "+movementProduct.numero;
  $("movementQty").value=""; $("movementNote").value=""; msg("modalMsg","");
  $("modal").classList.remove("hidden");
};
$("cancelModal").onclick=()=>$("modal").classList.add("hidden");
$("confirmModal").onclick=async()=>{
  const qty=parseInt($("movementQty").value,10);
  if(!qty||qty<1){msg("modalMsg","Indique uma quantidade válida.");return}
  const {error}=await sb.rpc("movimentar_stock",{p_product_id:movementProduct.id,p_tipo:movementType,p_quantidade:qty,p_observacao:$("movementNote").value.trim()||null});
  if(error){msg("modalMsg",error.message);return}
  $("modal").classList.add("hidden"); await loadProducts();
  if(!$("historyTab").classList.contains("hidden")) loadHistory();
};

$("newProductBtn").onclick=()=>{$("productNumber").value="";$("productName").value="";$("productStock").value="0";$("productMin").value="0";msg("productMsg","");$("productModal").classList.remove("hidden")};
$("cancelProduct").onclick=()=>$("productModal").classList.add("hidden");
$("saveProduct").onclick=async()=>{
  const numero=parseInt($("productNumber").value,10), nome=$("productName").value.trim(), stock=parseInt($("productStock").value,10)||0, stock_minimo=parseInt($("productMin").value,10)||0;
  if(Number.isNaN(numero)||numero<0||numero>220){msg("productMsg","O número deve estar entre 0 e 220.");return}
  const {error}=await sb.from("products").insert({numero,nome,stock,stock_minimo});
  if(error){msg("productMsg",error.message);return}
  $("productModal").classList.add("hidden"); await loadProducts();
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
  $("stockTab").classList.toggle("hidden",b.dataset.tab!=="stock"); $("historyTab").classList.toggle("hidden",b.dataset.tab!=="history");
  if(b.dataset.tab==="history") loadHistory();
});
$("refreshHistory").onclick=loadHistory;

async function loadHistory(){
  const {data,error}=await sb.from("stock_movements").select("*, products(numero,nome)").order("created_at",{ascending:false}).limit(200);
  if(error){$("historyBody").innerHTML=`<tr><td colspan="7">${escapeHtml(error.message)}</td></tr>`;return}
  const ids=[...new Set((data||[]).map(x=>x.user_id))];
  let names={};
  if(ids.length){const r=await sb.from("profiles").select("id,nome").in("id",ids);(r.data||[]).forEach(x=>names[x.id]=x.nome||"");}
  $("historyBody").innerHTML=(data||[]).map(x=>`<tr>
    <td>${new Date(x.created_at).toLocaleString("pt-PT")}</td>
    <td>${x.products?.numero??""} ${escapeHtml(x.products?.nome||"")}</td>
    <td>${x.tipo==="entrada"?"Entrada":"Saída"}</td><td>${x.quantidade}</td><td>${x.stock_anterior}</td><td>${x.stock_novo}</td>
    <td>${escapeHtml(names[x.user_id]||"Utilizador")}</td>
  </tr>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
init();
</script>

<div id="editProductModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Editar produto</h3>
      <button class="icon-btn" onclick="closeEditProduct()">×</button>
    </div>
    <div class="form-grid">
      <label>Número<input id="editNumero" type="number" disabled></label>
      <label>Nome<input id="editNome" type="text" placeholder="Nome do produto"></label>
      <label>Stock mínimo<input id="editMinimo" type="number" min="0" step="1"></label>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeEditProduct()">Cancelar</button>
      <button class="btn primary" onclick="saveEditProduct()">Guardar</button>
    </div>
  </div>
</div>

<script>
let editingProductId = null;

function openEditProduct(p){
  editingProductId = p.id;
  document.getElementById('editNumero').value = p.numero;
  document.getElementById('editNome').value = p.nome || '';
  document.getElementById('editMinimo').value = p.stock_minimo ?? 0;
  document.getElementById('editProductModal').classList.remove('hidden');
}
function closeEditProduct(){
  editingProductId = null;
  document.getElementById('editProductModal').classList.add('hidden');
}
async function saveEditProduct(){
  if(!editingProductId) return;
  const nome = document.getElementById('editNome').value.trim();
  const stock_minimo = Math.max(0, parseInt(document.getElementById('editMinimo').value || '0',10));
  const {error} = await sb.from('products').update({nome, stock_minimo}).eq('id', editingProductId);
  if(error){ alert(error.message); return; }
  closeEditProduct();
  if(typeof loadProducts === 'function') await loadProducts();
}
async function toggleProduct(p){
  const action = p.ativo ? 'desativar' : 'ativar';
  if(!confirm(`Tem a certeza que quer ${action} o produto ${p.numero}?`)) return;
  const {error} = await sb.from('products').update({ativo: !p.ativo}).eq('id', p.id);
  if(error){ alert(error.message); return; }
  if(typeof loadProducts === 'function') await loadProducts();
}

async function setupRealtime(){
  try{
    sb.channel('gestao-stock-realtime')
      .on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>{
        if(typeof loadProducts==='function') loadProducts();
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'stock_movements'},()=>{
        if(typeof loadProducts==='function') loadProducts();
        if(typeof loadHistory==='function') loadHistory();
      })
      .subscribe();
  }catch(e){ console.warn('Realtime:', e); }
}

function addManagementButtons(){
  const tables = [...document.querySelectorAll('table')];
  const table = tables.find(t => /Stock/i.test(t.innerText||'') && /Número|Numero/i.test(t.innerText||''));
  if(!table) return;
  const tbody = table.querySelector('tbody');
  if(!tbody) return;

  sb.from('products').select('*').order('numero').then(({data})=>{
    if(!data) return;
    [...tbody.rows].forEach(row=>{
      const match = (row.innerText||'').match(/^\s*(\d{1,3})\b/);
      if(!match) return;
      const p = data.find(x=>String(x.numero)===match[1]);
      if(!p || row.querySelector('.product-actions')) return;
      const cell = row.lastElementChild || row.insertCell();
      const box = document.createElement('div');
      box.className='product-actions';
      const edit = document.createElement('button');
      edit.className='btn-small';
      edit.textContent='Editar';
      edit.onclick=()=>openEditProduct(p);
      const toggle = document.createElement('button');
      toggle.className='btn-small '+(p.ativo?'btn-danger':'btn-success');
      toggle.textContent=p.ativo?'Desativar':'Ativar';
      toggle.onclick=()=>toggleProduct(p);
      box.append(edit,toggle);
      cell.appendChild(box);
    });
  });
}

window.addEventListener('load',()=>{
  setTimeout(setupRealtime,1200);
  setTimeout(addManagementButtons,1800);
  setInterval(addManagementButtons,4000);
});
</script>
</body>
</html>
